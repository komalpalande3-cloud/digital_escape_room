<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Level 3 - Code Breaker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>🔢 LEVEL 3</h1>

        <h2>THE CODE BREAKER</h2>

        <h3>
            ⏱️ Time Left:
            <span id="timer">03:00</span>
        </h3>

        <p>
            The server has generated a secret number sequence.
        </p>

        <p>
            Find the missing number to unlock the next level.
        </p>

        <div id="sequence"></div>

        <input
            type="number"
            id="answer"
            placeholder="Enter missing number"
        >

        <br>

        <button id="checkBtn">
            🔓 BREAK THE CODE
        </button>

        <p id="message"></p>

        <button id="nextBtn" style="display: none;">
            NEXT LEVEL →
        </button>

    </div>


    <script>


        const puzzles = [

            {
                sequence: [2, 4, 6, 8],
                answer: 10
            },

            {
                sequence: [3, 6, 12, 24],
                answer: 48
            },

            {
                sequence: [5, 10, 15, 20],
                answer: 25
            },

            {
                sequence: [1, 4, 7, 10],
                answer: 13
            }

        ];


        const randomIndex =
            Math.floor(Math.random() * puzzles.length);

        const puzzle =
            puzzles[randomIndex];



        document.getElementById("sequence").textContent =
            puzzle.sequence.join("  →  ") + "  →  ?";


        const checkButton =
            document.getElementById("checkBtn");

        const nextButton =
            document.getElementById("nextBtn");

        const message =
            document.getElementById("message");


        checkButton.addEventListener("click", function() {

            const userAnswer =
                Number(
                    document.getElementById("answer").value
                );


            if (userAnswer === puzzle.answer) {

                message.textContent =
                    "🎉 Correct! Code broken! +200 points";

                // Add score

                let score =
                    Number(localStorage.getItem("score")) || 0;

                score += 200;

                localStorage.setItem("score", score);


                nextButton.style.display =
                    "inline-block";

                checkButton.disabled = true;

            } else {

                message.textContent =
                    "❌ Incorrect! Try again.";

            }

        });

        nextButton.addEventListener("click", function() {

            window.location.href = "level4.html";

        });


        let endTime =
            localStorage.getItem("escapeEndTime");


        if (!endTime) {

            endTime =
                Date.now() + (3 * 60 * 1000);

            localStorage.setItem(
                "escapeEndTime",
                endTime
            );

        }


        const timer =
            setInterval(function() {

                const remaining =
                    Number(endTime) - Date.now();


                if (remaining <= 0) {

                    clearInterval(timer);

                    document.getElementById("timer").textContent =
                        "00:00";

                    localStorage.removeItem(
                        "escapeEndTime"
                    );

                    alert(
                        "⏰ Time's up! Game Over!"
                    );

                    window.location.href =
                        "index.html";

                    return;

                }


                const minutes =
                    Math.floor(
                        remaining / 60000
                    );


                const seconds =
                    Math.floor(
                        (remaining % 60000) / 1000
                    );


                document.getElementById("timer").textContent =
                    String(minutes).padStart(2, "0") +
                    ":" +
                    String(seconds).padStart(2, "0");


            }, 1000);

    </script>

</body>

</html>
