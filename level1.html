<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Level 1 - Digital Escape Room</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🔐 LEVEL 1</h1>

        <h2>THE RIDDLE</h2>

        <h3>⏱️ Time Left: <span id="timer">03:00</span></h3>

        <p>
            Solve the riddle to unlock the next level.
        </p>

        <p>
            I have keys but no locks.<br>
            I have space but no room.<br>
            You can enter, but you cannot go inside.<br>
            What am I?
        </p>

        <input type="text" id="answer" placeholder="Enter your answer">

        <br>

        <button id="checkBtn">CHECK ANSWER</button>

        <p id="message"></p>
        <button id="nextBtn" style="display: none;">
            NEXT LEVEL →
        </button>

    </div>

    <script>

    const checkButton = document.getElementById("checkBtn");
    const nextButton = document.getElementById("nextBtn");
    const answerInput = document.getElementById("answer");
    const message = document.getElementById("message");


    checkButton.addEventListener("click", function() {

       const answer = answerInput.value.trim().toLowerCase();

       if (answer === "keyboard") {

        message.textContent =
            "✅ Correct! The door is unlocked.";

        nextButton.style.display = "inline-block";

        } else {

        message.textContent =
            "❌ Wrong answer. Try again!";

        nextButton.style.display = "none";

    }

});


nextButton.addEventListener("click", function() {

    window.location.href = "level2.html";

});


let endTime = localStorage.getItem("escapeEndTime");

if (!endTime) {

    endTime = Date.now() + (3 * 60 * 1000);

    localStorage.setItem("escapeEndTime", endTime);

}


const timer = setInterval(function() {

    const remaining = Number(endTime) - Date.now();


    if (remaining <= 0) {

        clearInterval(timer);

        document.getElementById("timer").textContent = "00:00";

        localStorage.removeItem("escapeEndTime");

        alert("⏰ Time's up! Game Over!");

        window.location.href = "index.html";

        return;

    }


    const minutes =
        Math.floor(remaining / 60000);

    const seconds =
        Math.floor((remaining % 60000) / 1000);


    document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");


}, 1000);

</script>

</body>
</html>
